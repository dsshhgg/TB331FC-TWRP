name: Build TWRP for TB331FC

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # twrp-12.1 minimal manifest: self-consistent (recovery+vold+cryptfs all
  # present, no Android-14 fscrypt/AIDL regressions)
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-12.1
  # Stock-compatible GKI kernel release (TB331FC-Kernel), kernel extracted from boot-main.img
  KERNEL_REPO: yxyyds666/TB331FC-Kernel
  DEVICE_NAME: TB331FC
  DEVICE_PATH: device/lenovo/TB331FC

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      # ubuntu-22.04 runner has ~14GB free on / and 16GB RAM; Soong's
      # whole-tree analysis OOMs the runner cgroup. Use larger /mnt disk,
      # add swap, disable systemd-oomd.
      - name: Relocate build dir to /mnt and disable OOM killer
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo systemctl mask --now systemd-oomd.service systemd-oomd.socket || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg \
            gperf imagemagick liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev lib32z1-dev lib32ncurses-dev lib32readline-dev \
            libc6-dev-i386 lib32gcc-s1 lib32stdc++6 python3 python3-pip unzip

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Set up ccache
        run: |
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          ccache -M 6G
          ccache -o compression=true
          ccache -z

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-twrp12-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-twrp12-${{ runner.os }}-${{ github.ref }}-
            ccache-twrp12-${{ runner.os }}-

      - name: Install mkbootimg
        run: |
          mkdir -p /tmp/boottools
          curl -sL -o /tmp/boottools/unpack_bootimg.py https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-22.1/unpack_bootimg.py
          chmod +x /tmp/boottools/unpack_bootimg.py
          sudo ln -sf /tmp/boottools/unpack_bootimg.py /usr/local/bin/unpack_bootimg
          unpack_bootimg --help

      - name: Initialize repo (twrp-12.1)
        run: |
          sudo mkdir -p /mnt/workspace
          sudo chown "$(id -u):$(id -g)" /mnt/workspace
          ln -sfn /mnt/workspace workspace
          cd workspace
          git config --global user.name "TWRP Builder"
          git config --global user.email "twrp@localhost"
          repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}

      - name: Sync source
        run: |
          cd workspace
          repo sync -j$(nproc --all) --force-sync --no-tags --no-clone-bundle

      - name: Copy device tree into workspace
        run: |
          mkdir -p workspace/${{ env.DEVICE_PATH }}
          cp -r ${{ env.DEVICE_PATH }}/* workspace/${{ env.DEVICE_PATH }}/

      - name: Download latest kernel release (boot-main.img)
        run: |
          RELEASE_URL=$(curl -s "https://api.github.com/repos/${{ env.KERNEL_REPO }}/releases/latest" | grep -oP '"browser_download_url": "\K[^"]*boot-main\.img' | head -1)
          if [ -z "${RELEASE_URL}" ]; then
            echo "::error::No boot-main.img in latest release of ${{ env.KERNEL_REPO }}"
            exit 1
          fi
          echo "Downloading: ${RELEASE_URL}"
          curl -L -o /tmp/boot-main.img "${RELEASE_URL}"

      # Stock recovery_a.img contains NO kernel and an EMPTY cmdline (GKI
      # device, header v4). The bootloader injects the kernel from the boot
      # partition, so recovery.img is built with
      # BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE := true, which drops both the
      # kernel and the buildvariant=eng cmdline that build/make would otherwise
      # write into the header. The kernel is kept for reference only.
      - name: Extract kernel Image from boot-main.img
        run: |
          unpack_bootimg --boot_img /tmp/boot-main.img --out /tmp/boot_extract
          if [ ! -f /tmp/boot_extract/kernel ]; then
            echo "::error::kernel not found in boot-main.img"
            ls -la /tmp/boot_extract || true
            exit 1
          fi
          ls -la /tmp/boot_extract/kernel
          cp /tmp/boot_extract/kernel workspace/${{ env.DEVICE_PATH }}/prebuilt/kernel

      - name: Build TWRP
        run: |
          set -o pipefail
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_${{ env.DEVICE_NAME }}-eng
          ccache -s
          # 16GB RAM runner: cap parallel jobs to avoid OOM
          JOB_COUNT=2
          mka recoveryimage -j${JOB_COUNT} 2>&1 | tee /tmp/build.log
          if [ ! -f out/target/product/${{ env.DEVICE_NAME }}/recovery.img ]; then
            echo "recovery.img missing, trying bootimage"
            mka bootimage -j${JOB_COUNT} 2>&1 | tee -a /tmp/build.log
          fi
          # Build the standalone vbmeta partition image. BOARD_AVB_ENABLE +
          # --flags 3 yields an AVB-verification-DISABLED, testkey-signed
          # vbmeta (the device's stock vbmeta is testkey-signed too, pubkey
          # sha1 2597c218...). The stock vbmeta pins a Hash descriptor on the
          # recovery partition (stock digest) that a custom TWRP recovery can
          # never satisfy -> bootloader rejects it and falls back to fastboot.
          # Flashing this flags-3 vbmeta disables that enforcement so the
          # custom recovery boots. Shipped in the release; see flash steps.
          mka vbmeta -j${JOB_COUNT} 2>&1 | tee -a /tmp/build.log
          ccache -s

      - name: Locate and verify output
        run: |
          cd workspace
          FOUND=""
          for f in recovery.img boot.img; do
            if [ -f out/target/product/${{ env.DEVICE_NAME }}/$f ]; then
              FOUND="$f"
              echo "FOUND=$f" >> $GITHUB_ENV
              break
            fi
          done
          IMG=out/target/product/${{ env.DEVICE_NAME }}/${FOUND}
          if [ -z "${FOUND}" ] || [ ! -f "${IMG}" ]; then
            echo "::error::no recovery/boot img found"
            ls -la out/target/product/${{ env.DEVICE_NAME }}/ 2>&1 | tail -20
            tail -50 /tmp/build.log
            exit 1
          fi
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +%H%M)" >> $GITHUB_ENV
          echo "MD5_IMG=$(md5sum ${IMG} | cut -d ' ' -f 1)" >> $GITHUB_ENV
          ls -la ${IMG}
          # The vbmeta image is required on the device to disable AVB
          # verification (see Build TWRP step). Fail loudly if missing.
          VBMETA=out/target/product/${{ env.DEVICE_NAME }}/vbmeta.img
          if [ ! -f "${VBMETA}" ]; then
            echo "::error::vbmeta.img not found (required to disable AVB on device)"
            ls -la out/target/product/${{ env.DEVICE_NAME }}/ 2>&1 | tail -20
            tail -30 /tmp/build.log
            exit 1
          fi
          # Sanity: the shipped vbmeta MUST be flags=3 (AVB verification
          # disabled). Parse AvbVBMetaImageHeader directly (flags is u32 BE
          # @ offset 148) to avoid an avbtool runtime dependency.
          if ! python3 -c "import struct,sys; d=open(sys.argv[1],'rb').read(160); sys.exit(0 if (d[:4]==b'AVB0' and struct.unpack('>I',d[148:152])[0]==3) else 1)" "${VBMETA}"; then
            echo "::error::vbmeta is not flags-3 (AVB verification not disabled) - refusing to release a non-booting image"
            exit 1
          fi
          echo "OK: vbmeta flags=3 (AVB verification disabled)"
          echo "MD5_VBMETA=$(md5sum ${VBMETA} | cut -d ' ' -f 1)" >> $GITHUB_ENV
          ls -la ${VBMETA}

      # Regression guard: the Lenovo UEFI bootloader (same family as the
      # working TB321FU) refuses to boot recovery images whose header cmdline
      # is non-empty (stock recovery_a.img has empty cmdline + no kernel) and
      # falls back to fastboot. TARGET_PREBUILT_KERNEL=/dev/null only empties
      # the kernel; build/make appends "buildvariant=eng" to the cmdline
      # unless BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE is set. Verify the
      # final image actually matches the stock layout before releasing.
      - name: Verify recovery image header (empty cmdline / no kernel / os 99)
        run: |
          cd workspace
          IMG=out/target/product/${{ env.DEVICE_NAME }}/${{ env.FOUND }}
          rm -rf /tmp/verify_header
          HDR=$(unpack_bootimg --boot_img "${IMG}" --out /tmp/verify_header)
          echo "${HDR}"
          echo "${HDR}" | grep -Eq 'command line args: *$' \
            || { echo "::error::recovery cmdline must be EMPTY (Lenovo bootloader falls back to fastboot otherwise)"; exit 1; }
          echo "${HDR}" | grep -Eq 'kernel_size: *0' \
            || { echo "::error::recovery image must NOT contain a kernel (GKI: bootloader loads it from boot)"; exit 1; }
          echo "${HDR}" | grep -Eq 'os version: *99\.0\.0' \
            || { echo "::error::os_version must be 99.0.0 to match stock/TB321FU"; exit 1; }
          echo "OK: recovery image header matches stock layout (empty cmdline, no kernel, os 99.0.0)"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ env.FOUND }}
            workspace/out/target/product/${{ env.DEVICE_NAME }}/vbmeta.img
          name: "TWRP for ${{ env.DEVICE_NAME }} (${{ env.BUILD_DATE }})"
          tag_name: "twrp-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"
          body: |
            ### TWRP Recovery for Lenovo Xiaoxin Pad 2024 (TB331FC)
            **Build:** ${{ env.BUILD_DATE }} ${{ env.BUILD_TIME }}
            **Baseline:** twrp-12.1 minimal manifest (SM6225 bengal)
            **Kernel:** GKI 5.15.167 (stock KMI compatible)

            > ⚠️ **MANDATORY vbmeta flash.** This device's stock `vbmeta_a/b`
            > pins a Hash descriptor on the recovery partition; a custom TWRP
            > recovery can never match that digest, so the bootloader rejects
            > it and falls back to fastboot. Flash the included `vbmeta.img`
            > (AVB verification disabled, flags 3) to the vbmeta partition
            > **before** recovery, otherwise TWRP will not boot. This disables
            > Verified Boot device-wide (orange state) - the standard tradeoff
            > for custom recovery on AVB-enforcing devices.

            **Flash order (both slots):**
            ```
            fastboot flash vbmeta_a vbmeta.img
            fastboot flash vbmeta_b vbmeta.img
            fastboot flash recovery_a ${{ env.FOUND }}
            fastboot flash recovery_b ${{ env.FOUND }}
            ```

            **MD5 (recovery):** `${{ env.MD5_IMG }}`
            **MD5 (vbmeta):** `${{ env.MD5_VBMETA }}`
