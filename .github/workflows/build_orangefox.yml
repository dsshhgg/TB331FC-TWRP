name: Build OrangeFox for TB331FC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_orangefox.yml'
      - 'device/**'
  workflow_dispatch:

env:
  MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-12.1
  DEVICE: TB331FC
  DT_PATH: device/lenovo/TB331FC
  TARGET: recoveryimage
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl git wget python3 rsync flex bison libssl-dev libncurses5-dev libxml2-utils lzop pngcrush squashfs-tools
          sudo curl -sL -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo

      - name: Sync OrangeFox on TWRP 12.1 base
        run: |
          mkdir -p /mnt/work && ln -sfn /mnt/work work
          cd work
          repo init -u ${{ env.MANIFEST }} -b ${{ env.MANIFEST_BRANCH }} --depth=1 --groups=all,-notdefault,-device,-darwin,-x86,-mips
          repo sync -j$(nproc) --force-sync --no-tags --no-clone-bundle
          # OrangeFox overlay (same as Recovery-Builder-NoKernel recipe)
          rm -rf bootable/recovery vendor/recovery
          git clone --depth=1 -b fox_12.1 https://gitlab.com/OrangeFox/bootable/Recovery.git bootable/recovery || \
            git clone --depth=1 -b fox_12.1 https://github.com/OrangeFoxRecovery/bootable_Recovery.git bootable/recovery
          git clone --depth=1 -b fox_12.1 https://gitlab.com/OrangeFox/vendor/recovery.git vendor/recovery || \
            git clone --depth=1 -b fox_12.1 https://github.com/OrangeFoxRecovery/vendor_recovery.git vendor/recovery

      - name: Device tree
        run: |
          cd work
          mkdir -p ${{ env.DT_PATH }}
          cp -r ${{ github.workspace }}/${{ env.DT_PATH }}/* ${{ env.DT_PATH }}/
          # kernel from official release
          REL=$(curl -sL "https://api.github.com/repos/yxyyds666/TB331FC-Kernel/releases/latest" | grep -oP '"browser_download_url": "\K[^"]*boot-main\.img' | head -1)
          if [ -n "$REL" ]; then
            curl -sL -o /tmp/boot-main.img "$REL"
            curl -sL -o /tmp/unpack_bootimg.py https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-22.1/unpack_bootimg.py
            python3 /tmp/unpack_bootimg.py --boot_img /tmp/boot-main.img --out /tmp/bx
            [ -f /tmp/bx/kernel ] && cp /tmp/bx/kernel ${{ env.DT_PATH }}/prebuilt/kernel
          fi

      - name: Build OrangeFox
        run: |
          cd work
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_${{ env.DEVICE }}-eng
          mka ${{ env.TARGET }} -j2 2>&1 | tee /tmp/build.log

      - name: Package
        run: |
          cd work
          ls -la out/target/product/${{ env.DEVICE }}/ || true
          # vbmeta flags 3
          if [ -f external/avb/avbtool.py ]; then
            python3 external/avb/avbtool.py make_vbmeta_image --flags 3 --padding_size 65536 --output vbmeta.img || true
          fi
          mkdir -p dist
          cp out/target/product/${{ env.DEVICE }}/recovery.img dist/ 2>/dev/null || true
          cp out/target/product/${{ env.DEVICE }}/OrangeFox*.zip dist/ 2>/dev/null || true
          cp vbmeta.img dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-TB331FC
          path: dist/

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orangefox-${{ github.run_number }}
          files: dist/*

